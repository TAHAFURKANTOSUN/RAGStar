<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local RAG Assistant</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 800px; background: #181825; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 85vh; }
        h2 { text-align: center; color: #89b4fa; margin-top: 0; }
        .chat-box { flex: 1; overflow-y: auto; padding: 10px; border: 1px solid #313244; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; }
        .user-message { background-color: #89b4fa; color: #11111b; align-self: flex-end; font-weight: 500; }
        .bot-message { background-color: #313244; color: #cdd6f4; align-self: flex-start; }
        .input-box { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #45475a; background: #313244; color: #fff; font-size: 16px; outline: none; }
        button { padding: 12px 24px; background-color: #a6e3a1; color: #11111b; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #94e2d5; }
        .loading { display: none; color: #f9e2af; font-style: italic; font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>RAGStar</h2>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Merhaba! PDF dokümanınız yüklendi. Bana belgenizle ilgili her şeyi sorabilirsiniz.</div>
        </div>
        <div class="loading" id="loading">Llama 3.1 ve BGE düşünülüyor... </div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Soranızı yazın..." onkeydown="if(event.key==='Enter') askQuestion()">
            <button onclick="askQuestion()">Gönder</button>
        </div>
    </div>

    <script>
        async function askQuestion() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const loading = document.getElementById('loading');
            const question = input.value.trim();

            if (!question) return;

            // Kullanıcı mesajını ekle
            chatBox.innerHTML += `<div class="message user-message">${question}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                
                const data = await response.json();
                loading.style.display = 'none';

                // Bot yanıtını ekle
                chatBox.innerHTML += `<div class="message bot-message">${data.answer}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                loading.style.display = 'none';
                chatBox.innerHTML += `<div class="message bot-message" style="color:#f38ba8;">Hata oluştu! Sunucu bağlantısı kontrol edilmeli.</div>`;
            }
        }
    </script>
</body>
</html>
